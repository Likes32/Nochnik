<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ночник — дом в лесу</title>
<meta name="description" content="Один дом в хвойном лесу. Баня, купель с подогревом, тишина. Четыре спальных места, от 14 900 ₽ за ночь.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0D130F">

<link rel="icon" href="assets/logo-compact.svg" type="image/svg+xml">
<link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/onest-cyrillic.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/cormorant-cyrillic.woff2">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sections.css">
<link rel="stylesheet" href="css/floorplan.css">
<script>document.documentElement.classList.add("js")</script>
</head>
<body>

<div class="shell">

  <header class="nav" id="nav">
    <a class="nav__brand" href="#top" aria-label="Ночник, на главную">
      <svg viewBox="0 0 96 96" aria-hidden="true" focusable="false">
        <path d="M48 11 L87 81 L9 81 Z" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M41 81 L41 57 L55 57 L55 81 Z" fill="#F0B54A"/>
      </svg>
      <span>Ночник</span>
    </a>

    <button class="nav__burger" type="button" aria-expanded="false" aria-controls="menu">
      <span class="sr-only">Меню</span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>

    <nav class="nav__menu" id="menu" aria-label="Основная навигация">
      <a href="#house">Дом</a>
      <a href="#sauna">Баня и купель</a>
      <a href="#practice">Как добраться</a>
      <a class="nav__cta" href="#booking">Выбрать даты</a>
    </nav>
  </header>

  <main id="top">

    <!-- ── 18:40 · План дома ─────────────────────────────────── -->
    <section class="section plan" id="plan">
      <p class="mono section__time"><span>18:40</span></p>

      <div class="section__head">
        <h2>Всё, что здесь есть, — на одной странице</h2>
        <p>Участок, первый этаж и антресоль. Наведите на любой объект —
        расскажу, что там.</p>
      </div>

      <!-- ── Участок ── -->
      <figure class="plan__site">
        <figcaption class="mono">Участок · 30 × 21 м <span class="plan__scale">масштаб 1 : 50</span></figcaption>
        <svg viewBox="0 0 680 500" class="plan__svg" role="img"
             aria-label="План участка: дом с террасой, купель, баня, газовый гриль, подъезд и сосновый лес по границе">

          <path class="site__bound" d="M40 40 H300 M400 40 H640 V460 H40 V40"/>

          <!-- ворота -->
          <g class="room gate" tabindex="0" role="button"
             data-note="Ворота на ключе, закрываются кнопкой. Участок свой, посторонние сюда не заходят.">
            <path class="gate__leaf" d="M300 40 H346 M354 40 H400"/>
            <text class="glazing__label" x="350" y="28" text-anchor="middle">ворота на ключе</text>
          </g>

          <!-- дорожки с садовыми фонариками -->
          <g class="paths" aria-hidden="true">
            <path class="paths__line" d="M380 340 H312 Q262 340 244 332"/>
            <path class="paths__line" d="M330 300 Q262 292 224 268"/>
            <path class="paths__line" d="M448 316 H492"/>
            <g class="paths__lamp">
              <circle cx="332" cy="340" r="3.5"/><circle cx="290" cy="340" r="3.5"/>
              <circle cx="256" cy="336" r="3.5"/>
              <circle cx="314" cy="297" r="3.5"/><circle cx="276" cy="286" r="3.5"/>
              <circle cx="242" cy="276" r="3.5"/>
              <circle cx="464" cy="316" r="3.5"/><circle cx="482" cy="316" r="3.5"/>
            </g>
          </g>

          <g class="trees" aria-hidden="true">
            <path d="M70 70 l10 24 h-20 Z M120 62 l9 22 h-18 Z M180 74 l10 24 h-20 Z
                     M560 66 l10 24 h-20 Z M610 82 l9 22 h-18 Z M500 62 l10 24 h-20 Z
                     M70 420 l10 24 h-20 Z M130 434 l9 22 h-18 Z M600 424 l10 24 h-20 Z
                     M540 438 l9 22 h-18 Z M62 240 l10 24 h-20 Z M620 250 l10 24 h-20 Z"/>
          </g>

          <g class="room" tabindex="0" role="button"
             data-note="Парковка на две машины, сразу за воротами. Последние шесть километров до участка — грунтовка, зимой её чистят.">
            <path class="room__fill room__fill--outdoor" d="M300 40 H400 V150 H300 Z"/>
            <text class="room__label" x="350" y="100">Парковка
              <tspan class="room__area" x="350" dy="20">до 2 машин</tspan>
            </text>
          </g>

          <g class="room" tabindex="0" role="button"
             data-note="Дом. Два входа: сзади с парковки и спереди на террасу, через панорамный торец. Контур обведён светодиодной линией — в темноте дом виден от самых ворот.">
            <path class="room__fill" d="M320 150 H440 V290 H320 Z"/>
            <path class="led" d="M320 150 H440 V290 H320 Z"/>
            <text class="room__label" x="380" y="212">Дом
              <tspan class="room__area" x="380" dy="20">62 м²</tspan>
            </text>
          </g>

          <g class="room" tabindex="0" role="button"
             data-note="Терраса перед панорамным окном. Стол, кресла, здесь едят и сидят вечером.">
            <path class="room__fill room__fill--outdoor" d="M312 290 H448 V336 H312 Z"/>
            <text class="room__area" x="380" y="318" text-anchor="middle">терраса</text>
          </g>

          <g class="room" tabindex="0" role="button"
             data-note="Купель с автоматическим подогревом и фильтрацией — топить нечего, вода готова к приезду. Чаша не деревянная, с антикоррозийным покрытием, внутри подсветка.">
            <circle class="site__tub" cx="216" cy="322" r="30"/>
            <circle class="site__tub-glow" cx="216" cy="322" r="19"/>
            <text class="room__area" x="216" y="378" text-anchor="middle">купель</text>
          </g>

          <g class="room" tabindex="0" role="button"
             data-note="Баня. Отдельная постройка, топится по запросу за 3 500 ₽. Веники и простыни на месте.">
            <path class="room__fill" d="M120 200 H220 V270 H120 Z"/>
            <text class="room__label" x="170" y="232">Баня
              <tspan class="room__area" x="170" dy="20">отдельно</tspan>
            </text>
          </g>

          <g class="room" tabindex="0" role="button"
             data-note="Газовый гриль. Баллон полный, решётки чистые. Дрова возить и колоть не нужно.">
            <path class="room__fill" d="M492 292 H556 V336 H492 Z"/>
            <text class="room__area" x="524" y="360" text-anchor="middle">гриль</text>
          </g>

          <text class="site__note" x="640" y="446" text-anchor="end">по границе — сосновый лес</text>
        </svg>
      </figure>

      <!-- ── Этажи, строго в одном масштабе ── -->
      <div class="plan__grid">

        <figure class="plan__level">
          <figcaption class="mono">Первый этаж · 42 м² <span class="plan__scale">1 : 100</span></figcaption>
          <svg viewBox="0 0 680 800" class="plan__svg" role="img"
               aria-label="План первого этажа: коридор с задним входом и вешалкой под лестницей, ванная и кухня по левой стене, гостиная с диваном, гамаком и обеденной зоной у камина, панорамный торец с выходом на террасу">

            <g class="room" tabindex="0" role="button"
               data-note="Коридор. Задний вход с парковки: здесь разуваются, вешалка убрана под лестницу.">
              <path class="room__fill" d="M240 40 H540 V190 H240 Z"/>
              <text class="room__label" x="390" y="108">Коридор
                <tspan class="room__area" x="390" dy="21">4,5 м²</tspan>
              </text>
            </g>

            <g class="room" tabindex="0" role="button"
               data-note="Ванная слева от входа: душ, туалет, биде, раковина с подсвеченным зеркалом и тумбой на две секции, полотенцесушитель.">
              <path class="room__fill" d="M40 40 H240 V340 H40 Z"/>
              <text class="room__label" x="140" y="180">Ванная
                <tspan class="room__area" x="140" dy="21">6 м²</tspan>
              </text>
            </g>

            <g class="room" tabindex="0" role="button"
               data-note="Кухня вдоль левой стены, сразу за ванной: холодильник, кофемашина, чайник, заварник и шкаф с посудой на четверых.">
              <path class="room__fill" d="M40 340 H240 V540 H40 Z"/>
              <text class="room__label" x="140" y="430">Кухня
                <tspan class="room__area" x="140" dy="21">4 м²</tspan>
              </text>
            </g>

            <g class="room" tabindex="0" role="button"
               data-note="Лестница на антресоль. Крутая, как во всех A-frame, — с маленькими детьми неудобно. Держитесь за поручень.">
              <path class="room__fill" d="M540 40 H640 V340 H540 Z"/>
              <path class="stairs" d="M540 80 H640 M540 120 H640 M540 160 H640 M540 200 H640 M540 240 H640 M540 280 H640"/>
              <text class="room__area" x="590" y="316" text-anchor="middle">лестница</text>
            </g>

            <g class="room" tabindex="0" role="button"
               data-note="Гостиная в два света. Диван спинкой к правой стене раскладывается на двоих, рядом подвесное кресло-гамак и обеденная зона у камина.">
              <path class="room__fill" d="M240 190 H540 V340 H640 V740 H40 V540 H240 Z"/>
              <text class="room__label" x="330" y="440">Гостиная
                <tspan class="room__area" x="330" dy="21">24,5 м²</tspan>
              </text>
            </g>

            <!-- обеденная зона: от кухни до выхода, в стороне от прохода на террасу -->
            <g class="room dining" tabindex="0" role="button"
               data-note="Обеденная зона у камина: стол на четверых и два стула. Стоит в стороне от прохода на террасу — мимо можно ходить с тарелками.">
              <path class="room__fill room__fill--zone" d="M40 560 H280 V740 H40 Z"/>
              <rect class="furn__stove" x="56" y="586" width="46" height="64" rx="3"/>
              <circle class="furn__stove-glow" cx="79" cy="618" r="10"/>
              <circle class="furn__soft furn__table" cx="186" cy="650" r="44"/>
              <circle class="furn__soft" cx="186" cy="580" r="19"/>
              <circle class="furn__soft" cx="186" cy="720" r="19"/>
              <text class="furn__label" x="79" y="672" text-anchor="middle">камин</text>
              <text class="furn__label" x="186" y="655" text-anchor="middle">стол</text>
            </g>

            <!-- мягкая зона -->
            <g class="furn" aria-hidden="true">
              <rect class="furn__soft" x="548" y="420" width="92" height="200" rx="6"/>
              <text class="furn__label" x="594" y="528" text-anchor="middle">диван</text>
              <path class="furn__face" d="M540 440 V600"/>

              <circle class="furn__soft" cx="470" cy="672" r="40"/>
              <text class="furn__label" x="470" y="678" text-anchor="middle">гамак</text>
            </g>

            <!-- вешалка под лестницей -->
            <g class="furn" aria-hidden="true">
              <rect class="furn__soft" x="466" y="52" width="66" height="30" rx="4"/>
              <text class="furn__label" x="499" y="102" text-anchor="middle">вешалка</text>
            </g>

            <!-- климат -->
            <g class="panic room" tabindex="0" role="button"
               data-note="Кондиционер и приточная вентиляция. Воздух с улицы идёт через фильтр и подогревается, поэтому окна зимой открывать не нужно.">
              <rect class="panic__body" x="596" y="392" width="34" height="20" rx="3"/>
              <text class="room__area" x="590" y="382" text-anchor="end">климат</text>
            </g>

            <!-- стены -->
            <g class="plan__walls" aria-hidden="true">
              <path class="wall wall--inner" d="M240 40 V540 M540 40 V340 M40 340 H240 M40 540 H240 M240 190 H540 M540 340 H640"/>
              <path class="wall" d="M40 40 H640 V740 H40 Z"/>
            </g>

            <!-- задний вход -->
            <g class="door" aria-hidden="true"><path d="M330 40 H450"/></g>
            <text class="glazing__label" x="390" y="30" text-anchor="middle">задний вход</text>

            <!-- кнопка вызова охраны -->
            <g class="panic room" tabindex="0" role="button"
               data-note="Тревожная кнопка у входа. Одно нажатие — и выезжает вооружённая охрана. Одиннадцать километров до ближайшего фонаря не значит, что вы одни.">
              <rect class="panic__body" x="252" y="150" width="34" height="26" rx="4"/>
              <circle class="panic__dot" cx="269" cy="163" r="6"/>
              <text class="room__area" x="296" y="168">вызов охраны</text>
            </g>

            <!-- панорамный торец с дверью на террасу -->
            <g class="glazing" aria-hidden="true">
              <path d="M40 740 H290 M410 740 H640"/>
              <path class="glazing__inner" d="M40 733 H290 M410 733 H640"/>
            </g>
            <g class="door" aria-hidden="true"><path d="M290 740 H410"/></g>
            <text class="glazing__label" x="340" y="770" text-anchor="middle">панорамный торец · выход на террасу</text>
          </svg>
        </figure>

        <figure class="plan__level">
          <figcaption class="mono">Антресоль · 20 м² <span class="plan__scale">1 : 100</span></figcaption>
          <svg viewBox="0 0 680 800" class="plan__svg" role="img"
               aria-label="План антресоли: двуспальная кровать, окно с занавеской у изголовья, ограждение в ногах, за которым основное панорамное окно">

            <g class="room" tabindex="0" role="button"
               data-note="Спальня под скатом. Настоящая двуспальная кровать 180 × 200, лампы с обеих сторон. В полный рост встаёшь по центру.">
              <path class="room__fill" d="M40 40 H640 V380 H40 Z"/>
              <text class="room__label" x="150" y="300">Спальня
                <tspan class="room__area" x="150" dy="21">20 м²</tspan>
              </text>
            </g>

            <g class="furn" aria-hidden="true">
              <rect class="furn__bed" x="250" y="70" width="180" height="200" rx="4"/>
              <text class="furn__label" x="340" y="166" text-anchor="middle">кровать
                <tspan class="furn__label" x="340" dy="19">180 × 200</tspan>
              </text>
              <circle class="furn__lamp" cx="222" cy="96" r="13"/>
              <circle class="furn__lamp" cx="458" cy="96" r="13"/>
              <text class="furn__label" x="222" y="132" text-anchor="middle">лампа</text>
              <text class="furn__label" x="458" y="132" text-anchor="middle">лампа</text>
            </g>

            <g class="plan__walls" aria-hidden="true">
              <path class="wall" d="M40 40 H640 V380 H40 Z"/>
            </g>

            <g class="room" tabindex="0" role="button"
               data-note="Окно у изголовья. Есть плотная занавеска — утреннее солнце сюда бьёт рано.">
              <path class="glazing__head" d="M250 40 H430"/>
              <text class="glazing__label" x="340" y="30" text-anchor="middle">окно у изголовья · занавеска</text>
            </g>

            <g class="railing room" tabindex="0" role="button"
               data-note="Ограждение в ногах кровати. Дальше пусто до самого низа: лёжа смотришь в основное панорамное окно и на гостиную.">
              <path class="railing__line" d="M40 380 H640"/>
              <text class="glazing__label" x="340" y="410" text-anchor="middle">ограждение · открыто вниз</text>
            </g>

            <g class="void" aria-hidden="true">
              <path d="M40 380 H640 V740 H40 Z"/>
              <text class="void__label" x="340" y="556" text-anchor="middle">пустота над гостиной</text>
            </g>

            <g class="glazing" aria-hidden="true">
              <path d="M40 740 H640"/>
              <path class="glazing__inner" d="M40 733 H640"/>
            </g>
            <text class="glazing__label" x="340" y="770" text-anchor="middle">основное панорамное окно</text>
          </svg>
        </figure>

      </div>

      <p class="plan__note" data-floorplan-note aria-live="polite">
        Наведите на помещение или выберите его с клавиатуры.
      </p>
    </section>

  </main>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
